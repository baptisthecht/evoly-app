name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    # vulnérabilités connues des dépendances de production (CDC section 13.1) ; exclusions justifiées dans docs/SECURITE.md
    runs-on: ubuntu-24.04 # version fixée : ubuntu-latest passe à Ubuntu 26 le 19 octobre 2026, migration à faire délibérément
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Vulnérabilités élevées et critiques
        run: pnpm audit --prod --audit-level high

  verify:
    runs-on: ubuntu-24.04 # version fixée : ubuntu-latest passe à Ubuntu 26 le 19 octobre 2026, migration à faire délibérément
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evoly
          POSTGRES_PASSWORD: evoly
          POSTGRES_DB: evoly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evoly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://evoly:evoly@localhost:5432/evoly
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      # paiements Stripe de bout en bout (mode test) : actifs seulement si les secrets existent ; sinon vides, parcours ignorés.
      # La clé publique est lue à la construction ; la clé secrète n'est donnée qu'à l'étape des paiements.
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
      E2E_STRIPE_ACCOUNT: ${{ secrets.E2E_STRIPE_ACCOUNT }}
      # billetteries en sous-domaines de localhost (org.localhost:3001), comme en développement
      NEXT_PUBLIC_BASE_DOMAIN: localhost:3001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ORDER_TOKEN_SECRET: ci-order-token-secret-0123456789abcdef
      CRON_SECRET: ci-cron-secret-0123456789abcdef
      # connexion Google : identifiants factices (le test vérifie seulement la redirection vers Google)
      AUTH_GOOGLE_ID: evoly-test.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: secret-de-test
      # Wallet : type de pass et équipe factices ; certificats générés à chaque exécution (étape ci-dessous)
      APPLE_PASS_TYPE_ID: pass.me.evoly.test
      APPLE_TEAM_ID: TEAM123456
      GOOGLE_WALLET_ISSUER_ID: "3388000000012345678"
      GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: wallet@evoly-test.iam.gserviceaccount.com
      EMAIL_OUTBOX_DIR: /tmp/evoly-outbox
      PROSPECTION_SKIP_MX: "1" # adresses de test aux domaines fictifs : pas de requête DNS
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatage (Prettier)
        run: pnpm format:check
      - name: Outils des tests (lecture des PDF) et identifiants Wallet de test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          d=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$d/key.pem" -out "$d/cert.pem" -days 2 -subj "/CN=Pass Type ID: pass.me.evoly.test" 2>/dev/null
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$d/google.pem" 2>/dev/null
          {
            echo "APPLE_PASS_CERT_PEM=$(base64 -w0 "$d/cert.pem")"
            echo "APPLE_PASS_KEY_PEM=$(base64 -w0 "$d/key.pem")"
            echo "APPLE_WWDR_PEM=$(base64 -w0 "$d/cert.pem")"
            echo "GOOGLE_WALLET_PRIVATE_KEY=$(base64 -w0 "$d/google.pem")"
          } >> "$GITHUB_ENV"
      - name: Base de données
        run: |
          pnpm db:generate
          pnpm --filter @evoly/db exec prisma db push
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/prisma/sql/constraints.sql
          pnpm db:seed
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @evoly/app build
      - name: Parcours complets
        working-directory: apps/app
        run: |
          npx playwright install --with-deps chromium
          (npx next start -p 3001 &) && npx wait-on -t 60000 http://localhost:3001/api/health
          npx playwright test
      - name: Paiements réels par l'API de Stripe (mode test)
        if: env.E2E_STRIPE_ACCOUNT != ''
        # bloquant : chemin de l'argent face au vrai Stripe de test (validé le 22 octobre 2026)
        working-directory: apps/app
        env:
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
        run: npx vitest run test/stripe-real.test.ts --coverage.enabled=false
      - name: Paiements Stripe de bout en bout (mode test)
        if: env.E2E_STRIPE_ACCOUNT != ''
        # non bloquant : les protections anti-fraude de Stripe (hCaptcha) freinent irrégulièrement les navigateurs
        # automatisés ; le chemin de l'argent reste couvert par les tests serveur avec un faux Stripe
        continue-on-error: true
        working-directory: apps/app
        env:
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
        run: |
          # le serveur des parcours complets change de nom en démarrant (next-server) : arrêt par ses noms et par son port,
          # puis attente que le port soit libre, sinon l'ancien serveur, sans la clé secrète, continuerait de répondre
          pkill -f "next-server" || true
          pkill -f "next start" || true
          fuser -k 3001/tcp 2>/dev/null || true
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3001/api/health || break; sleep 1; done
          (npx next start -p 3001 &) && npx wait-on -t 60000 http://localhost:3001/api/health
          npx playwright test e2e/stripe-payments.spec.ts --project=desktop
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: apps/app/test-results
