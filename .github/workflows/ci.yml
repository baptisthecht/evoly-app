name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evoly
          POSTGRES_PASSWORD: evoly
          POSTGRES_DB: evoly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evoly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://evoly:evoly@localhost:5432/evoly
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      EMAIL_OUTBOX_DIR: /tmp/evoly-outbox
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Base de données
        run: |
          pnpm db:generate
          pnpm --filter @evoly/db exec prisma db push
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/prisma/sql/constraints.sql
          pnpm db:seed
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @evoly/app build
      - name: Parcours complets
        working-directory: apps/app
        run: |
          npx playwright install --with-deps chromium
          (npx next start -p 3001 &) && npx wait-on -t 60000 http://localhost:3001/api/health
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/app/test-results
