# Dépendances npm : vérification hebdomadaire par la garde avant envoi (ops/versions-check.mjs, docs/MAINTENANCE.md),
# avec un âge minimal de 14 jours et des versions majeures migrées une par une. Dependabot ne garde que les actions GitHub,
# avec le même délai de 14 jours. Les alertes de sécurité de GitHub (paramètres du dépôt) restent actives.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
